<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Log In</title>
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <h2 class="logo">Movie Review App</h2>
        <ul class="menu">
          <li class="menu-item"><a href="/" class="menu-link">Home</a></li>
          <li class="menu-item">
            <a href="/movies" class="menu-link">Movies</a>
          </li>
          <li class="menu-item">
            <a href="#" class="menu-link">Contact Us</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="main">
      <h1 class="page-title">Welcome to user login page!</h1>
      <p class="">*enter the following:</p>
      <div class="form-container">
        <form action="/user/login" method="post">
          <div class="form-group">
            <label for="id" class="form-label">ID</label><br /><input
              type="text"
              name="id"
              id="id"
              class="form-control"
              placeholder="Enter user ID"
            />
          </div>
          <div class="form-group">
            <label for="password" class="form-label">Password</label
            ><br /><input
              type="password"
              name="password"
              id="password"
              class="form-control"
              placeholder="Enter password"
            />
          </div>
          <div class="form-group">
            <button type="submit" class="btn-success">Log In</button>
          </div>
        </form>
      </div>
      <div class="">
        <p>OR</p>
        <p>not yet registered? register <a href="/user/signup">here</a></p>
      </div>
    </main>
    <footer class="footer">
      <div class="">
        <p class="">&copy; www.moviereview.xyz, 2026</p>
      </div>
    </footer>
  </body>
</html>
